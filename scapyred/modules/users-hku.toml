# List the user SIDs loaded under HKEY_USERS.
# Each subkey of HKU is a loaded user hive (a SID). Interactive/service logons
# show up here as full S-1-5-21-... account SIDs alongside the well-known
# service SIDs (S-1-5-18/19/20) and .DEFAULT. Read-only.
title = "List loaded user hives (HKU SIDs)"
short = "users-hku"

[[actions]]
op  = "list"
key = "HKU"
